version: 2
updates:
  # Python dependencies (pyproject.toml). Catches both routine version bumps
  # and, more importantly, the moment a new CVE lands against something this
  # project depends on — continuous, unlike pip-audit's point-in-time CI checks.
  - package-ecosystem: "pip"
    directory: "/"
    # pydantic pins pydantic-core exactly, so a minor or major bump of the core
    # alone can never install. It moves when pydantic does. Patch bumps still
    # come. (This list used to hold a dozen packages semgrep pinned; semgrep
    # now has its own lock, below, and its pins no longer reach this one.)
    ignore:
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # mcp 2 removed the server decorators serve() uses; held below 2 in
      # pyproject until the port lands. Remove with that pin.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
    # Wait before proposing an update to a newly published version — gives
    # the ecosystem time to catch a malicious or broken release before this
    # repo pulls it in.
    cooldown:
      default-days: 7

  # The hashed lock CI installs from (requirements/ci.txt). Without this entry
  # the lock would pin today's versions forever and the CVE alerts above
  # would have nothing to open a pull request against. Same cooldown, which
  # the lock now makes meaningful: CI installs what Dependabot proposed and a
  # person merged, not whatever was published an hour ago.
  #
  # The same directory holds requirements/runtime.txt, the container image's
  # lock, so a bump here usually arrives as a pair of pull requests. Both
  # files are uv universal locks, and Dependabot rewrites them for Linux only:
  # PR #45 dropped a Windows-only pin that way while CI stayed green. So its
  # edits are never merged as they stand. The locks are regenerated with the
  # command in each header, together, and the pull requests are closed in
  # favour of that.
  #
  # **Pin the regeneration to the version Dependabot proposed.** The header
  # command alone moves nothing -- uv keeps the pins already in the output
  # file. The obvious fix, `--upgrade-package <name>`, upgrades to the
  # LATEST release, which ignores the `cooldown` below entirely. Measured on
  # 2026-09-23 against the filelock/virtualenv bumps (#239-#242):
  #
  #     --upgrade-package filelock     -> 4.0.3   a MAJOR bump, uploaded TODAY
  #     --upgrade-package virtualenv   -> 21.11.1             uploaded TODAY
  #     what Dependabot proposed       -> 3.32.7 / 21.7.10, 7-8 days old
  #
  # So this remedy, followed the natural way, is more dangerous than the edit
  # it replaces. Name the version:
  #
  #     --upgrade-package "filelock==3.32.7"
  #
  # which reproduced Dependabot's edit byte-for-byte on that occasion.
  #
  # A bump to a DEV-only package arrives as two IDENTICAL PRs against ci.txt,
  # not as a ci.txt/runtime.txt pair: the "/" entry above now reaches
  # requirements/ci.txt too, so both entries propose the same change.
  - package-ecosystem: "pip"
    directory: "/requirements"
    ignore:
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # semgrep's own lock. Only semgrep itself is proposed: everything else in
  # this file is whatever that semgrep release pins, and bumping one of those
  # alone is exactly the pull request that can never install. A semgrep bump
  # recompiles the lock, which moves its dependencies with it.
  - package-ecosystem: "pip"
    directory: "/requirements/semgrep"
    allow:
      - dependency-name: "semgrep"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The base image of the runtime Dockerfile and of the dev container, pinned
  # by digest. A digest never moves by itself, which is the point of pinning
  # it and also why it goes stale: this entry is what brings in a rebuilt
  # python:3.12-slim with its security fixes. The two must stay the same digest
  # (tests/test_container.py fails otherwise), so they are one entry and one
  # group, and move in a single pull request. Same cooldown as the rest.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Digest updates within 3.12 only. The image is "the environment CI runs
    # in", and CI runs 3.12, so a new Python is a decision made in ci.yml
    # first, not a base-image bump: #54 moved both Dockerfiles to 3.14-slim
    # and tests/test_container.py rightly failed it.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-image:
        patterns:
          - "python"

  # GitHub Actions used in ci.yml. Actions here are pinned to commit SHAs
  # (see ci.yml) rather than mutable version tags, for supply-chain
  # hardening — Dependabot still tracks SHA-pinned actions and opens PRs
  # that bump the SHA (and its trailing version comment) when a new release
  # ships, so pinning doesn't mean going stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # codeql-action's init, analyze and upload-sarif must run the same
    # version: CodeQL refuses a config written by one release and read by
    # another. Bumped one per pull request, every one of those PRs failed
    # CodeQL, so they are proposed together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
