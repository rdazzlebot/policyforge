name: ci

on:
  push:
  pull_request:

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits too

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pip-audit (dependency CVEs)
        run: pip-audit

      - name: bandit (static security analysis)
        run: bandit -c pyproject.toml -r src

      - name: mdformat (markdown quality)
        run: |
          pip install mdformat mdformat-gfm
          mdformat --check README.md data/frameworks/*/README.md

      - name: pytest
        run: pytest -q
