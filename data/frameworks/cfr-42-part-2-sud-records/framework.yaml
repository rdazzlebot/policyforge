id: cfr-42-part-2-sud-records
name: Substance Use Disorder Patient Records (42 CFR Part 2)
licence: public-domain
source: eCFR public API, via policyforge etl-part2
notes: A US government work, so freely redistributable. Bundled with this project and safe
  to commit to any repository. Only TWO of Part 2's thirty-eight sections are here - 2.16
  (security for records and notification of breaches) and 2.19 (disposition of records by
  discontinued programs). The rest of the part is conduct - when a disclosure is permitted,
  what a consent must contain, what a court must find - and citing a conduct rule as a control
  asserts a safeguard exists where the regulation says only that a disclosure was lawful.
  The thinness is the correct answer rather than a parse failure. Read README.md for the test
  that decided it and for the sections it rejected.
