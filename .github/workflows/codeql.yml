name: codeql

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, independent of pushes — catches newly-published CodeQL query
    # coverage (or a newly disclosed pattern) against code that hasn't
    # otherwise changed.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # required to upload results to the Security tab
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85  # v3
        with:
          languages: python
          # The default suite is tuned for a low false-positive rate on huge
          # codebases. This repo is small enough to absorb the extra noise,
          # and it handles compliance data and API credentials, so the wider
          # net is worth it.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85  # v3
