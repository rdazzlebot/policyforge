id: cfr-171-information-blocking
name: Information Blocking (45 CFR Part 171)
licence: public-domain
source: eCFR public API, via policyforge etl-info-blocking
notes: A US government work, so freely redistributable. Bundled with this project and safe
  to commit to any repository. Not a control catalog - Part 171 defines information blocking
  and then sets out the exceptions to it, so each entry is a condition under which a practice
  does NOT count as blocking, rather than a safeguard to implement. Read README.md before
  mapping it to a control framework.
