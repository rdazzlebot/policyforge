# Notice a framework update before an assessor does.
#
# NIST republishes the 800-53 OSCAL catalog without announcing it to you.
# The failure mode is silent: documents keep citing AC-2 while AC-2 quietly
# says something else, and nobody finds out until somebody reads both.
#
# This runs the ETL on a schedule and diffs the result against the committed
# catalog. A red build here is the notification, and the job log is the
# triage list — which controls moved, which of your topics and documents
# they reach, and which recorded parameter decisions were made against
# wording that has since changed.
#
# It writes nothing. Applying the update is a pull request somebody opens
# after reading the report, because deciding what a changed requirement
# means is the part that needs a person.
name: framework-drift

on:
  schedule:
    # Monthly. Catalog revisions are infrequent, and a job that cried wolf
    # weekly would be muted inside two months.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: check for a catalog update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .

      # Overwrites the catalog in the working copy. Git still holds the
      # version that was committed, which is what `drift` compares against.
      - name: Fetch the current catalog
        run: policyforge etl-oscal

      # --fail-on-change is the point: a green build means nothing moved,
      # and a red one is the only notification anybody gets.
      - name: What changed, and what it reaches
        run: |
          policyforge drift \
            --controls data/frameworks/nist-800-53-r5/controls.json \
            --detail --fail-on-change
