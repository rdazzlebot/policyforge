name: ci

on:
  push:
  pull_request:

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits too

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pip-audit (dependency CVEs)
        run: pip-audit

      - name: bandit (static security analysis)
        run: bandit -c pyproject.toml -r src

      - name: semgrep (broader SAST)
        run: |
          semgrep scan --config=p/python --config=p/security-audit \
            --config=p/owasp-top-ten --error .

      - name: mdformat (markdown quality)
        run: |
          pip install mdformat mdformat-gfm
          mdformat --check README.md data/frameworks/*/README.md

      - name: pytest
        run: pytest -q
