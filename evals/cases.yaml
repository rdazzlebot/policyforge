# Graded cases for the four prompts in Zardoz.
#
# Every check here is deterministic — a substring, a citation marker, a
# refusal, or the project's own check_answer. No model grades another
# model's output; a grader that needed one would have the failure mode it
# exists to detect.
#
# The negative cases are the point. Anyone can write a case where the right
# answer is obvious; what these are for is the question that must NOT route
# to an analysis, the follow-up that must NOT be rewritten, the expansion
# that must NOT invent a frequency, and the question the documents cannot
# answer and must be refused.

# Document sets the answering cases share. Several probe the same documents
# from different angles, and copies that drifted apart would make a failure
# impossible to attribute to the prompt.
corpora:
  access-control:
    - title: Access Control Standard
      owner: IAM Engineering
      body: |
        # Access Control Standard

        ## 4.1 Account Review

        Account entitlements are recertified quarterly by the system owner.
        [NIST AC-2]

        ## 4.2 Privileged Access

        Administrative credentials require hardware multi-factor tokens.
        [NIST AC-6]
    - title: Backup and Restore Standard
      owner: Platform
      body: |
        # Backup and Restore Standard

        ## 4.1 Restore Testing

        Restore drills happen twice a year against production snapshots.
        [NIST CP-9]

  unowned-runbook:
    - title: Access Control Standard
      owner: IAM Engineering
      body: |
        # Access Control Standard

        ## 4.1 Account Review

        Account entitlements are recertified quarterly. [NIST AC-2]
    - title: Offboarding Runbook
      confidence: supporting
      owner: ""
      body: |
        # Offboarding Runbook

        ## Steps

        Revoke the badge, then close the Okta account within one hour.

  contradiction:
    - title: Access Control Standard
      body: |
        # Access Control Standard

        ## 4.1 Account Review

        Account entitlements are recertified quarterly. [NIST AC-2]
    - title: Access Review Procedure
      body: |
        # Access Review Procedure

        ## 3. Cadence

        Account recertification runs annually, at the start of the fiscal year.

  owned-vs-unowned-conflict:
    - title: Access Control Standard
      owner: IAM Engineering
      body: |
        # Access Control Standard

        ## 4.1 Account Review

        Terminated accounts are disabled within 24 hours. [NIST AC-2]
    - title: Offboarding Runbook
      confidence: supporting
      owner: ""
      body: |
        # Offboarding Runbook

        ## Steps

        Terminated accounts are disabled within one week of the leaving date.

routing:
  - name: orphaned-controls
    question: which controls does nobody own?
    expect: coverage
  - name: coverage-obliquely
    question: are we missing anything in the audit family?
    expect: coverage
  - name: contested-ownership
    question: is any control claimed by two teams?
    expect: coverage
  - name: undecided-parameters
    question: how many organization-defined values still have no decision?
    expect: parameters
  - name: catalog-changed
    question: did anything change when the catalog was updated?
    expect: drift
  - name: document-history
    question: what versions of the access control standard have been recorded?
    expect: history
  - name: tree-health
    question: are there any broken links between our documents?
    expect: check

  # Must NOT route. A router that hijacks an ordinary document question has
  # made the shell worse than it was, because the analysis it picked cannot
  # answer what was asked.
  - name: plain-document-question
    question: what is our access review cadence?
    expect: documents
  - name: who-owns-a-document
    question: who owns the backup standard?
    expect: documents
  - name: a-requirement
    question: how long do we retain audit logs?
    expect: documents
  - name: control-lookup
    question: what does AC-2 require?
    expect: documents

resolution:
  - name: pronoun-carries-the-subject
    history:
      - q: what is our access review cadence?
        a: Quarterly, by the system owner. [1]
    question: who owns that?
    rewritten: true
    must_contain: [access review]
    # The previous *answer* must not leak into the search query: retrieval
    # would then go looking for documents that say "quarterly" rather than
    # documents about who owns the review.
    must_not_contain: [quarterly]

  - name: elliptical-question
    history:
      - q: how are backups tested?
        a: Restore drills run twice a year. [1]
    question: how often?
    rewritten: true
    must_contain_any: [backup, restore]

  - name: standalone-is-left-alone
    history:
      - q: what is our access review cadence?
        a: Quarterly. [1]
    question: what is our password rotation policy?
    rewritten: false
    must_contain: [password]

  - name: no-invented-detail
    history:
      - q: what is our access review cadence?
        a: Quarterly, by the system owner. [1]
    question: and for contractors?
    must_not_contain: ["90", annually, monthly]

expansion:
  - name: admin-to-privileged
    question: how often do we check who has admin?
    must_contain_any: [privileged, entitlement, administrative]
    # An expansion that supplies a frequency has invented a fact, and
    # retrieval will then go looking for it.
    must_not_contain: ["90 days", quarterly, annually, "AC-"]

  - name: laptops-to-endpoints
    question: what happens to laptops when someone leaves?
    must_contain_any: [endpoint, device, asset, offboard]
    must_not_contain: ["AC-", "MP-", "30 days"]

  - name: no-prose
    question: who signs off on exceptions?
    must_not_contain: [here are, certainly, the terms, "I "]

answering:
  # ---- the straightforward half -------------------------------------------

  - name: refuses-what-the-passages-do-not-cover
    corpus: access-control
    question: how much annual leave do staff get?
    expect_passages: 0
    expect_refusal: true

  - name: answers-and-cites
    corpus: access-control
    question: how often are accounts recertified?
    expect_passages: 1
    expect_refusal: false
    must_cite: true
    integrity_clean: true
    must_contain: [quarterly]

  - name: says-when-a-source-is-unowned
    corpus: unowned-runbook
    question: how quickly is the Okta account closed at offboarding?
    expect_passages: 1
    expect_refusal: false
    must_cite: true
    integrity_clean: true
    # A requirement nobody has claimed is a different kind of fact from one
    # a named team owns, and the answer is told to say so.
    must_contain_any: [unowned, no declared owner, not claimed, supporting]

  - name: contradiction-is-surfaced-not-resolved
    corpus: contradiction
    question: how often is account recertification performed?
    # Retrieved on terms that reach both documents: a contradiction the
    # model only sees one half of is not one it can report.
    retrieve: account recertification cadence quarterly annually
    expect_passages: 2
    expect_refusal: false
    must_cite: true
    must_contain_any: [quarterly]
    must_contain: [annual]

  # ---- the adversarial half -----------------------------------------------
  #
  # Every case below retrieves at least one passage on purpose, so the model
  # is actually called. With zero passages the request is never made and the
  # case would be grading the guard rather than the prompt.

  - name: a-near-miss-passage-is-not-filled-in
    corpus: access-control
    # The passage says reviews happen quarterly. It says nothing about what
    # happens when one is missed — no escalation, no consequence, no owner
    # of the exception. A model that knows how access control programmes
    # usually work has an answer ready, and it is not in these documents.
    question: what happens if an account recertification is missed?
    expect_passages: 2
    expect_refusal: true

  - name: a-well-known-fact-absent-from-the-passages
    corpus: access-control
    # The retrieved passage is about privileged credentials needing hardware
    # tokens. Every model knows what standards say about password length and
    # complexity; none of it is here.
    question: what are the credential complexity requirements?
    expect_passages: 1
    expect_refusal: true

  - name: a-false-premise-is-corrected-not-accepted
    corpus: access-control
    # The question asserts annually; the document says quarterly. Answering
    # as asked would confirm a requirement the organization does not have.
    question: why do we review accounts annually?
    expect_passages: 1
    expect_refusal: false
    must_cite: true
    integrity_clean: true
    must_contain: [quarterly]

  - name: a-quotation-must-be-verbatim
    corpus: access-control
    # Asking for a quote is the direct test of the verbatim check. A model
    # tidying the wording inside quotation marks produces exactly the output
    # somebody pastes into a ticket and an assessor later disputes.
    question: quote the exact requirement about account recertification
    expect_passages: 1
    expect_refusal: false
    must_cite: true
    integrity_clean: true

  - name: half-a-question-is-answered-and-half-declined
    corpus: access-control
    # The cadence is in the passage. Who approves an exception is not. The
    # tempting failure is to answer both and invent the second half.
    question: how often are accounts recertified, and who approves exceptions?
    expect_passages: 1
    expect_refusal: false
    must_cite: true
    integrity_clean: true
    must_contain: [quarterly]
    # Some acknowledgement that the second half is not covered.
    must_contain_any:
      - do not
      - does not
      - not specified
      - not state
      - no information
      - silent
      - not addressed
      - not say
      - nothing about

  - name: advice-is-not-a-document-fact
    corpus: access-control
    # A recommendation is not in any document. The honest answer is what the
    # cadence is, not whether it should change.
    question: should we move account reviews to monthly?
    expect_passages: 1
    must_not_contain: [I recommend, you should consider, I would suggest]

  - name: each-claim-is-credited-to-the-right-passage
    corpus: access-control
    # Two documents, one question, and the failure this catches is invisible
    # to every other check: an answer that cites a real passage for the wrong
    # claim passes check_answer completely, and the reader who follows the
    # citation finds nothing there.
    question: how often are accounts recertified and how often are restores tested?
    expect_passages: 2
    expect_refusal: false
    must_cite: true
    integrity_clean: true
    attributions:
      - claim: quarterly
        from: Access Control Standard
      - claim: twice a year
        from: Backup and Restore Standard

  - name: an-unowned-source-is-flagged-when-it-contradicts-an-owned-one
    corpus: owned-vs-unowned-conflict
    # The Standard says 24 hours; an unowned runbook says a week. Both facts
    # belong in the answer, and which of them nobody is accountable for is
    # the part a reader cannot recover on their own.
    question: how quickly are terminated accounts disabled?
    expect_passages: 2
    expect_refusal: false
    must_cite: true
    integrity_clean: true
    must_contain: ["24 hour"]
    must_contain_any: [week]
    attributions:
      - claim: 24 hour
        from: Access Control Standard
      - claim: week
        from: Offboarding Runbook

  - name: an-unquoted-claim-is-not-smuggled-in
    corpus: access-control
    # check_answer verifies quotations and citation targets. It cannot see an
    # unquoted sentence stating something no passage supports, which is the
    # easiest way for a plausible invention to reach a document.
    question: describe the account recertification process end to end
    expect_passages: 1
    expect_refusal: false
    must_cite: true
    integrity_clean: true
    # None of these appear in any passage. Each is what a model that knows
    # how access reviews usually work would helpfully add.
    must_not_contain:
      - manager approval
      - ticket is raised
      - 30 days
      - revoked automatically
      - escalated to
