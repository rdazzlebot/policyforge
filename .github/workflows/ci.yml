name: ci

on:
  push:
  pull_request:

# Least privilege, as content.yml and codeql.yml already declare. Without a
# block this job ran with whatever default the repository grants. Nothing
# here writes: tests and scanners read the checkout, and gitleaks reads a
# pull request's commits — its PR comments are switched off below, since
# they were the only thing that needed write access and a leak still fails
# the job.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits too

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check src tests scripts

      - name: ruff (format)
        run: ruff format --check src tests scripts

      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: pip-audit (dependency CVEs)
        run: pip-audit

      - name: bandit (static security analysis)
        run: bandit -c pyproject.toml -r src

      - name: semgrep (broader SAST)
        run: |
          semgrep scan --config=p/python --config=p/security-audit \
            --config=p/owasp-top-ten --error .

      - name: mdformat (markdown quality)
        # mdformat-gfm and mdformat-frontmatter are already project
        # dependencies, so no extra install here — and pulling them from the
        # pinned project install keeps this identical to what pre-commit and
        # scripts/check.py run. Without mdformat-frontmatter, mdformat
        # rewrites YAML frontmatter into a heading.
        run: mdformat --check README.md data/frameworks/*/README.md .claude/skills/*/SKILL.md

      - name: pytest
        run: pytest -q
