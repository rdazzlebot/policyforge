# Copy this to config.yaml (already gitignored) and fill in your own values.
# Never put an actual API key in this file — reference an environment
# variable name instead, and set that variable in your shell / .env.

llm:
  provider: anthropic          # supported: anthropic, bedrock, vertex
  model: claude-opus-4-6       # or claude-sonnet-4-6, etc. — check your provider's
                                 # available models list; this is just an example
  api_key_env: ANTHROPIC_API_KEY  # anthropic only — ignored by bedrock/vertex, which
                                    # use their cloud's normal credential chain instead
  # region: us-east-1          # bedrock only (default: us-east-1). Requires
                                 # `pip install "policyforge[bedrock]"`.
  # project_id: my-gcp-project  # vertex only, required. Your GCP project ID.
  # region: us-central1         # vertex only (default: us-central1). Requires
                                 # `pip install "policyforge[vertex]"` and Google Cloud
                                 # Application Default Credentials
                                 # (`gcloud auth application-default login`).

frameworks:
  # Where to look for framework catalogs, in order. The first match for an
  # id wins, so your own newer export shadows a bundled one without deleting
  # anything.
  search_paths:
    - data/frameworks     # bundled with policyforge: 800-53, HIPAA (public domain)
    - frameworks          # your own, committed alongside your docs/ tree
    - local_content       # your own, deliberately kept out of git

  # Some catalogs are licensed rather than public domain — HITRUST CSF and
  # GovRAMP are the ones this project maps. Whether your repository may hold
  # a copy is a question about YOUR licence, and only you can answer it.
  #
  # Leave this false and `policyforge check` fails if licensed content is
  # ever committed here — keep it under local_content/ (gitignored) instead.
  # Set it true if your MyCSF/GovRAMP licence permits your own repository to
  # carry the export, which for a private repo it commonly does.
  allow_licensed_in_repo: false

  # Each catalog directory should carry a framework.yaml declaring its terms:
  #   id: hitrust-csf
  #   name: HITRUST CSF v11.3
  #   licence: licensed        # or: public-domain
  #   source: MyCSF export, 2026-01
  # A directory with no manifest is treated as licensed. Assuming content is
  # freely redistributable because nobody said otherwise is the mistake with
  # consequences.

org:
  name: "Example Org"
  industry: ""

  # Tools, keyed by the role each one fills. Naming the role is what makes
  # substitution deterministic: the generator is told what a tool is FOR
  # rather than inferring it from a product name, and every `[Identity
  # Provider]` in a generated document becomes "Okta" or none of them does.
  #
  # `policyforge roles` lists every key. A flat list still works and still
  # means "these exist, work out where they go" — it is just less exact.
  vendors: {}
    # identity_provider: Okta
    # endpoint_protection: CrowdStrike
    # ticketing: Jira
    # siem: Splunk

  # Teams, keyed by the function each one performs. This is what lets a
  # generated procedure say "Identity and Access Management" instead of
  # [Responsible Team].
  teams: {}
    # identity_access: IAM Engineering
    # security_operations: SecOps
    # grc: Security Assurance

# Optional. Describes the system a System Security Plan is written about,
# using NIST SP 800-18's plan elements. Only used by `policyforge ssp`;
# anything left blank becomes a visible [Placeholder] in the workbook rather
# than being guessed at. `--system-name` overrides `name` for a one-off run.
system:
  name: ""
  identifier: ""
  system_type: ""            # General Support System | Major Application | Minor Application
  operational_status: ""     # Operational | Under Development | Major Modification
  # FIPS 199 impact levels — Low | Moderate | High. `overall_categorization`
  # is the high-water mark of the three, and is what picks the 800-53
  # baseline you'd pass to `policyforge ssp --baseline`.
  confidentiality: ""
  integrity: ""
  availability: ""
  overall_categorization: ""
  owner: ""
  authorizing_official: ""
  security_officer: ""
  description: ""
  environment: ""
  interconnections: ""
  laws_and_regulations: []

# Optional. Where the Zardoz conversational shell reads from
# (`policyforge zardoz`). Only used by `zardoz sync`.
zardoz:
  # A markdown content tree — the documents as files. Needs no credentials,
  # so this alone is enough to sync and ask questions offline. In a
  # repo-backed setup this is the source of truth and Confluence is the
  # published copy, so where both are configured the tree wins.
  content_dir: ""            # e.g. docs
  # Your Confluence base URL, so you don't retype it on every sync.
  host: ""                   # e.g. https://yourorg.atlassian.net/wiki
  # An extra space pulled in as *supporting* context: real content, often
  # more current than the governance set, but nobody has declared what it is
  # or who owns it. Answers may draw on it and will say when they did.
  # Leave blank to sync only the pages your topic registry declares, which
  # are the ones that arrive knowing their topic, owner and tier.
  supporting_space: ""       # e.g. RUNBOOKS
